modality: llm
description: "LLM annotation taxonomy for reasoning quality, metacognitive behaviors, reasoning types, failure modes, and summary metrics."
groups:
  reasoning_quality:
    description: "Reasoning-quality labels."
    fields:
      reasoning_present:
        type: boolean
        definition: "Is there actual step-by-step reasoning rather than a direct answer?"
        true_if: "Shows intermediate steps, explanations, or deductions."
        false_if: "Jumps directly to the answer with no reasoning shown."
      logical_steps_valid:
        type: boolean
        definition: "Do the reasoning steps logically follow from each other?"
        true_if: "Each step follows logically from previous steps."
        false_if: "Contains non-sequiturs, invalid inferences, circular reasoning, or logical gaps."
      reaches_correct_conclusion:
        type: boolean
        definition: "Does the chain-of-thought reasoning lead to the correct answer?"
        true_if: "Final answer matches ground truth."
        false_if: "Final answer does not match ground truth."
      context_understanding:
        type: boolean
        definition: "Does it correctly understand and use information from the question or context?"
        true_if: "Correctly interprets the question, extracts relevant information, and uses correct values."
        false_if: "Misreads the question, misinterprets information, or uses wrong values."

  metacognitive_behaviors:
    description: "Shared higher-order behaviors used for cross-modal analysis."
    fields:
      planning_present:
        type: boolean
        definition: "Does it break the problem into sub-steps or make a plan upfront?"
        true_if: "Explicit problem decomposition or plan before solving."
        false_if: "Solves directly without structure."
      hypothesis_testing:
        type: boolean
        definition: "Does it propose multiple possibilities and test them?"
        true_if: "Considers alternatives or explicitly checks different possibilities."
        false_if: "Commits to the first interpretation without considering alternatives."
      self_correction:
        type: boolean
        definition: "Does it revise or correct earlier claims?"
        true_if: "Explicitly revises or corrects an earlier statement."
        false_if: "Never revisits or corrects earlier statements."
      uncertainty_acknowledgment:
        type: boolean
        definition: "Does it explicitly note ambiguity or uncertainty?"
        true_if: "Explicitly acknowledges ambiguity or uncertainty."
        false_if: "States everything with full certainty regardless of ambiguity."
      evidence_citation:
        type: boolean
        definition: "Does it reference specific parts of the question or context to support claims?"
        true_if: "Grounds claims in specific information from the prompt or context."
        false_if: "Makes claims without connecting them to specific evidence."
      confidence_calibration:
        type: boolean
        definition: "Does the model's confidence match the certainty of its reasoning?"
        true_if: "Uncertain when reasoning is weak; confident when reasoning is strong."
        false_if: "Overconfident with weak reasoning, or underconfident with strong reasoning."
      self_awareness:
        type: boolean
        definition: "Does it recognize the limits of what can be determined from given information?"
        true_if: "Notes that some conclusion cannot be determined from the available information."
        false_if: "Claims certainty about things that cannot be determined."
      goal_tracking:
        type: boolean
        definition: "Does it maintain and reference sub-goals in multi-step problems?"
        true_if: "Tracks progress toward intermediate goals."
        false_if: "Loses track of the original goal or solves the wrong sub-problem."
      knowledge_alignment:
        type: boolean
        definition: "Does it invoke appropriate domain knowledge to solve the problem?"
        true_if: "Applies relevant mathematical, scientific, or logical concepts."
        false_if: "Manipulates symbols without domain understanding, or applies the wrong knowledge."

  reasoning_types:
    description: "Types of reasoning used in the response."
    fields:
      mathematical_reasoning:
        type: boolean
        definition: "Involves calculations, equations, formulas, or numerical operations."
        true_if: "Uses arithmetic, algebra, geometry, statistics, or proofs."
        false_if: "No mathematical operations are present."
      logical_reasoning:
        type: boolean
        definition: "Involves deductive or inductive logic, formal reasoning."
        true_if: "Uses if-then reasoning, deduction, syllogisms, or truth-table style logic."
        false_if: "No formal logical operations are present."
      causal_reasoning:
        type: boolean
        definition: "Analyzes cause-effect relationships."
        true_if: "Explains mechanisms, causes, or effects."
        false_if: "No causal analysis."
      analogical_reasoning:
        type: boolean
        definition: "Makes comparisons or draws analogies."
        true_if: "Uses analogy or cross-domain comparison."
        false_if: "No analogies or comparisons."
      procedural_reasoning:
        type: boolean
        definition: "Follows or describes step-by-step processes or algorithms."
        true_if: "Executes sequential operations or procedures."
        false_if: "No procedural steps."
      factual_recall:
        type: boolean
        definition: "Relies primarily on retrieving factual knowledge."
        true_if: "Uses definitions, historical facts, or established knowledge without derivation."
        false_if: "No factual retrieval is needed."
      conceptual_reasoning:
        type: boolean
        definition: "Reasons about abstract concepts and their relationships."
        true_if: "Relates concepts or reasons about abstract ideas."
        false_if: "No abstract conceptual work."

  failure_modes:
    description: "Failure modes. A true value means the failure occurred."
    fields:
      factual_error:
        type: boolean
        definition: "Contains incorrect factual claims, knowledge errors, or calculation mistakes."
        true_if: "Includes wrong facts, wrong definitions, wrong formulas, or math errors."
        false_if: "All facts and calculations are correct."
      logical_failure:
        type: boolean
        definition: "Reasoning steps do not logically connect or contain errors."
        true_if: "Contains invalid inferences, contradictions, or non-sequiturs."
        false_if: "All logical steps are valid."
      context_misread:
        type: boolean
        definition: "Misunderstands or misinterprets the question or given information."
        true_if: "Answers the wrong question, misreads values, or misinterprets constraints."
        false_if: "Correctly understands the question and context."
      knowledge_gap:
        type: boolean
        definition: "Lacks necessary domain knowledge to solve the problem."
        true_if: "Does not know required concepts, formulas, or facts."
        false_if: "Has the necessary domain knowledge."
      post_hoc_rationalization:
        type: boolean
        definition: "Appears to give the answer first, then make up reasoning."
        true_if: "Reasoning seems reverse-engineered and does not support the conclusion."
        false_if: "Reasoning genuinely leads to the conclusion."
      shortcut:
        type: boolean
        definition: "Skips important logical or computational steps."
        true_if: "Jumps to the conclusion without necessary intermediate reasoning or calculation."
        false_if: "All necessary steps are shown."
      lucky_guess:
        type: boolean
        definition: "Reaches the correct answer but the reasoning is wrong or irrelevant."
        true_if: "Correct answer with invalid or irrelevant reasoning path."
        false_if: "Correct answer with valid supporting reasoning."

  summary_metrics:
    description: "Trace-level summary metrics."
    fields:
      complexity_score:
        type: integer
        values: [1, 2, 3, 4, 5]
        definition: "1 = single-step inference; 2 = sequential 2-3 steps; 3 = multi-step with dependencies; 4 = hierarchical decomposition with sub-problems; 5 = complex reasoning with hypothesis testing and self-correction."
      reasoning_direction:
        type: categorical
        values: ["forward", "backward", "mixed"]
        definition: "forward = starts from given information and works toward the answer; backward = starts from answer options and works backward to justify; mixed = combines both approaches."
      efficiency:
        type: categorical
        values: ["concise", "verbose", "insufficient"]
        definition: "concise = appropriate length with necessary steps; verbose = unnecessarily long or repetitive; insufficient = too short and missing key steps."
      overall_quality:
        type: categorical
        values: ["strong", "flawed", "poor"]
        definition: "strong = sound reasoning, accurate logic, and coherent chain to the correct conclusion; flawed = reasoning present with notable issues; poor = major failures, severe errors, or no real reasoning."
      would_make_good_judge:
        type: boolean
        definition: "Whether the response would be trustworthy for judging other models' reasoning."
